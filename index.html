<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mitschnitt am Switch</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #fff; --ink: #16202b; --muted: #5b6876; --line: #d5dce4; --soft: #f4f6f9;
    --blue: #1558d6; --blue-soft: #e5eefd; --ok: #17794a; --ok-soft: #e3f4ea; --bad: #b3261e; --bad-soft: #fdecea;
    --arp: #c2410c; --arp-soft: #fff1e7; --ip: #1558d6; --gold-soft: #fff6dd;
    --f-dst: #dbe7ff; --f-src: #d8f1e2; --f-typ: #ffe7b3; --f-dat: #eceff3; --f-pad: #f7f8fa;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         display: grid; grid-template-rows: auto minmax(0, 1fr); font-size: 15px; }
  @media (max-width: 1099px), (max-height: 659px) { html, body { height: auto; } }
  button, select, input { font: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; flex: 1; min-width: 300px; }
  .prog { font-weight: 700; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .bar { width: 120px; height: 8px; border-radius: 99px; background: #dde3ea; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); transition: width .4s; }
  .hbtn { border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; padding: 6px 9px; border-radius: 8px; }
  .hbtn:hover { background: #e2e7ed; color: var(--ink); }

  main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(380px, 1fr); gap: 14px; padding: 0 18px 14px; min-height: 0; }
  @media (max-width: 1099px) { main { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }
  .col.left { overflow: hidden; }
  .scrollpart { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; flex: 1; }
  @media (max-width: 1099px), (max-height: 659px) { .col.left { overflow: visible; } .scrollpart { overflow: visible; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .card > h2, .chead h2 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .02em; }
  .chead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 8px; flex-wrap: wrap; }

  /* Netz */
  .net { flex-shrink: 0; }
  .net svg { display: block; width: 100%; height: auto; max-height: 36vh; }
  .caption { margin: 0 12px 12px; border-radius: 10px; background: var(--soft); padding: 9px 12px; font-size: 15px; line-height: 1.4; min-height: 40px; }
  .cable { stroke: #9aa6b2; stroke-width: 6; fill: none; stroke-linejoin: round; }
  .cable.hot { stroke: var(--blue); stroke-width: 9; }
  .pcb { fill: #fff; stroke: var(--ink); stroke-width: 2.5; }
  .t-name { font-size: 22px; font-weight: 800; }
  .t-ip { font-size: 17px; font-weight: 700; fill: var(--blue); font-family: var(--mono); }
  .t-mac { font-size: 16px; font-family: var(--mono); }
  .t-sw { font-size: 21px; font-weight: 800; fill: #fff; }
  .t-swl { font-size: 12px; font-weight: 800; fill: #8ea0b4; letter-spacing: .05em; }
  .t-swr { font-size: 14.5px; fill: #cfd8e3; font-family: var(--mono); }
  .t-swp { font-size: 14.5px; fill: #fff; font-weight: 800; }
  .t-port { font-size: 15px; font-weight: 800; }
  .badge text { font-size: 15px; font-weight: 800; fill: #fff; }
  .pkt text { font-size: 13px; font-weight: 800; fill: #fff; }

  /* Mitschnitt */
  .tabs { display: flex; gap: 4px; }
  .tabs button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tabs button:disabled { opacity: .45; cursor: not-allowed; }
  .filter { font-size: 12.5px; color: var(--muted); padding: 0 14px 6px; font-family: var(--mono); }
  table.cap { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.cap th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 800; padding: 5px 8px; background: var(--soft); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.cap td { padding: 6px 8px; border-bottom: 1px solid #edf0f4; white-space: nowrap; font-family: var(--mono); font-size: 13.5px; }
  table.cap td.info { font-family: inherit; font-size: 14px; white-space: normal; }
  table.cap tr.row { cursor: pointer; }
  table.cap tr.row:hover td { background: #f3f7ff; }
  table.cap tr.row.arp td:first-child { box-shadow: inset 4px 0 var(--arp); }
  table.cap tr.row.ipv4 td:first-child { box-shadow: inset 4px 0 var(--ip); }
  table.cap tr.row.sel td { background: var(--blue-soft); }
  .capwrap { overflow-x: auto; padding-bottom: 6px; }

  /* Details */
  .detail { padding-bottom: 12px; }
  .detail .empty { padding: 4px 14px 6px; color: var(--muted); }
  .fields { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.15fr) auto minmax(0, 1fr); margin: 0 14px; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
  .fields > div { padding: 7px 9px; border-left: 1px solid rgba(0,0,0,.15); min-width: 0; cursor: default; }
  .fields > div:first-child { border-left: 0; }
  .fields .k { font-size: 11.5px; font-weight: 800; color: #3d4955; text-transform: uppercase; letter-spacing: .03em; }
  .fields .k small { font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .fields .v { font-family: var(--mono); font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-dst { background: var(--f-dst); } .f-src { background: var(--f-src); } .f-typ { background: var(--f-typ); } .f-dat { background: var(--f-dat); }
  .sub { margin: 8px 14px 0; border-radius: 10px; background: var(--f-dat); padding: 8px 12px; }
  .sub .st { font-size: 12px; font-weight: 800; color: #3d4955; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
  .sub table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .sub td { padding: 3px 6px 3px 0; vertical-align: top; }
  .sub td:first-child { color: var(--muted); width: 150px; white-space: nowrap; }
  .sub td.mono { font-weight: 700; }
  .sub tr.hl td { background: #fff7d6; }
  .dtools { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 14px 0; }
  .btn { border-radius: 9px; padding: 8px 14px; font-weight: 700; font-size: 14.5px; border: 2px solid var(--ink); background: #fff; color: var(--ink); }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.soft { border-color: var(--line); color: var(--muted); }
  .btn.small { padding: 5px 10px; font-size: 13.5px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .hex { margin: 10px 14px 0; font-family: var(--mono); font-size: 13.5px; line-height: 1.7; background: var(--soft); border-radius: 10px; padding: 8px 10px; overflow-x: auto; }
  .hex .r { white-space: nowrap; }
  .hex .o { color: #9aa4af; margin-right: 10px; }
  .hex b { font-weight: 600; padding: 1px 2px; border-radius: 3px; margin-right: 2px; }
  .hex b.dst { background: var(--f-dst); } .hex b.src { background: var(--f-src); } .hex b.typ { background: var(--f-typ); } .hex b.dat { background: var(--f-dat); } .hex b.pad { color: #b0b8c1; }
  .hex b.hl { outline: 2px solid var(--ink); }
  .hexleg { font-family: system-ui, sans-serif; font-size: 12.5px; color: var(--muted); margin-top: 4px; }

  /* Aufgaben */
  .tasks { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .intro { font-size: 15px; line-height: 1.5; background: var(--soft); border-radius: 10px; padding: 10px 12px; }
  .task { border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; }
  .task h3 { margin: 0; font-size: 15.5px; display: flex; gap: 8px; align-items: baseline; }
  .task h3 .n { color: var(--blue); }
  .task.done { background: #fbfdfc; border-color: #bfe3cf; }
  .task.done h3 .n { color: var(--ok); }
  .task.locked { opacity: .5; }
  .task.locked .body { display: none; }
  .task .body { margin-top: 8px; font-size: 15px; line-height: 1.45; }
  .task p { margin: 6px 0; }
  .q { margin: 10px 0 4px; font-weight: 600; }
  select, input[type=text] { border: 2px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff; font-size: 15px; }
  select:focus, input:focus { outline: none; border-color: var(--blue); }
  input[type=text] { font-family: var(--mono); width: 170px; }
  .checks { display: flex; gap: 6px; flex-wrap: wrap; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; user-select: none; }
  .checks input { width: 16px; height: 16px; }
  .opts { display: grid; gap: 6px; }
  .opts label { display: flex; gap: 8px; align-items: flex-start; border: 2px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
  .opts input { margin-top: 3px; }
  .fb { margin-top: 10px; border-radius: 9px; padding: 9px 11px; line-height: 1.45; }
  .fb.ok { background: var(--ok-soft); color: #0f5233; } .fb.err { background: var(--bad-soft); color: #6c1611; }
  .fb b.term { background: #fff; border-radius: 5px; padding: 0 5px; }
  .row-act { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .link { border: 0; background: var(--blue-soft); color: var(--blue); font-weight: 700; border-radius: 7px; padding: 2px 8px; font-size: 13.5px; }
  .term-out { font-family: var(--mono); font-size: 13px; background: #101820; color: #d7e0ea; border-radius: 9px; padding: 9px 11px; white-space: pre; overflow-x: auto; line-height: 1.45; margin: 6px 0; }
  .term-out .pr { color: #8fd18f; }
  .result { border: 2px solid var(--ok); border-radius: 12px; padding: 12px 14px; background: #fbfdfc; }
  .result h3 { margin: 0 0 8px; font-size: 17px; color: var(--ok); }
  .steps3 { display: grid; gap: 8px; margin: 8px 0; }
  .steps3 div { border-radius: 9px; padding: 8px 10px; background: var(--soft); line-height: 1.45; }
  .steps3 b.t { display: block; }
  .done-frame { display: grid; grid-template-columns: auto auto auto minmax(0, 1fr); border: 2px solid var(--ink); border-radius: 9px; overflow: hidden; font-size: 13px; margin: 6px 0; }
  .done-frame > div { padding: 5px 7px; border-left: 1px solid rgba(0,0,0,.15); }
  .done-frame > div:first-child { border-left: 0; }
  .done-frame .k { font-size: 10.5px; font-weight: 800; text-transform: uppercase; color: #3d4955; }
  .done-frame .v { font-family: var(--mono); font-weight: 700; white-space: nowrap; }
  @keyframes flash { 0% { background: #fff3c4; } 100% { background: transparent; } }
  .flash { animation: flash 1.2s; }
</style>
</head>
<body>
<header>
  <h1>Mitschnitt am Switch: Wie kommt PC 1 an die MAC von PC 3?</h1>
  <div class="prog"><span id="progTxt">Aufgabe 1 von 9</span><span class="bar"><i id="progBar" style="width:0%"></i></span></div>
  <button class="hbtn" id="resetBtn">↺ Neu starten</button>
  <button class="hbtn" id="fsBtn"></button>
</header>
<main>
  <div class="col left">
    <section class="card net">
      <div class="chead"><h2>Das Netz</h2><span style="font-size:13px;color:var(--muted)">MAC‑Tabelle des Switches wie nach dem Rollenspiel</span></div>
      <svg id="svg" viewBox="0 0 1000 390" aria-label="Netz mit vier PCs und einem Switch"></svg>
      <div class="caption" id="caption">Öffne unten eine Nachricht aus dem Mitschnitt und spiel ihren Weg ab.</div>
    </section>
    <div class="scrollpart" id="scrollpart">
    <section class="card">
      <div class="chead"><h2>Mitschnitt</h2><div class="tabs" id="tabs"></div></div>
      <div class="filter" id="filter"></div>
      <div class="capwrap"><table class="cap"><thead><tr><th>Nr.</th><th>Zeit</th><th>Ziel‑MAC</th><th>Quell‑MAC</th><th>Typ</th><th>Info</th></tr></thead><tbody id="capBody"></tbody></table></div>
    </section>
    <section class="card detail" id="detail"></section>
    </div>
  </div>
  <div class="col">
    <section class="card tasks" id="tasks"></section>
  </div>
</main>

<script>
(function () {
  "use strict";
  var BC = "FF:FF:FF:FF:FF:FF", ZERO = "00:00:00:00:00:00";
  var PCS = {
    1: { id: 1, port: 2, ip: "192.168.1.101", mac: "00:1B:44:11:3A:B7", x: 870, y: 62 },
    2: { id: 2, port: 4, ip: "192.168.1.102", mac: "3C:52:82:6E:0F:14", x: 870, y: 328 },
    3: { id: 3, port: 1, ip: "192.168.1.103", mac: "00:1B:44:2C:91:E5", x: 130, y: 62 },
    4: { id: 4, port: 3, ip: "192.168.1.104", mac: "F4:8E:38:A0:57:C2", x: 130, y: 328 }
  };
  var SWT = { "00:1B:44:2C:91:E5": 1, "00:1B:44:11:3A:B7": 2, "F4:8E:38:A0:57:C2": 3, "3C:52:82:6E:0F:14": 4 };
  var SW = { x: 500, y: 195, w: 330, h: 170 };
  var PORT = { 1: [SW.x - SW.w / 2, SW.y - 40], 2: [SW.x + SW.w / 2, SW.y - 40], 3: [SW.x - SW.w / 2, SW.y + 40], 4: [SW.x + SW.w / 2, SW.y + 40] };
  function byPort(n) { for (var k in PCS) if (PCS[k].port === n) return PCS[k]; }
  function byMac(m) { for (var k in PCS) if (PCS[k].mac === m) return PCS[k]; }

  /* ---------- Mitschnitte ---------- */
  function arp(op, from, sha, spa, tha, tpa) { return { kind: "arp", op: op, from: from, sha: sha, spa: spa, tha: tha, tpa: tpa }; }
  function ipv4(from, dstMac, sip, dip, text, id) { return { kind: "ipv4", from: from, dstMac: dstMac, sip: sip, dip: dip, text: text, id: id }; }
  var CAPS = {
    mi: { name: "Mittwoch", filter: "Filter: nur Nachrichten von und an PC 1 und PC 3 · Mittwoch, 08:15 Uhr", rows: [
      { nr: 17, t: "08:15:02,104", dst: BC, src: PCS[1].mac, m: arp(1, 1, PCS[1].mac, PCS[1].ip, ZERO, PCS[3].ip) },
      { nr: 18, t: "08:15:02,105", dst: PCS[1].mac, src: PCS[3].mac, m: arp(2, 3, PCS[3].mac, PCS[3].ip, PCS[1].mac, PCS[1].ip) },
      { nr: 19, t: "08:15:02,106", dst: PCS[3].mac, src: PCS[1].mac, m: ipv4(1, PCS[3].mac, PCS[1].ip, PCS[3].ip, "Ist der Drucker im 2. OG wieder online?", 0x1a2b) },
      { nr: 23, t: "08:16:10,553", dst: PCS[3].mac, src: PCS[1].mac, m: ipv4(1, PCS[3].mac, PCS[1].ip, PCS[3].ip, "Danke! Ich schicke dir gleich den Druckauftrag.", 0x1a2c) }
    ]},
    fr: { name: "Freitag (Zusatz)", filter: "Filter: nur Nachrichten von und an PC 1, PC 3 und PC 4 · Freitag, 10:42 Uhr", rows: [
      { nr: 40, t: "10:42:17,310", dst: BC, src: PCS[1].mac, m: arp(1, 1, PCS[1].mac, PCS[1].ip, ZERO, PCS[3].ip) },
      { nr: 41, t: "10:42:17,311", dst: PCS[1].mac, src: PCS[3].mac, m: arp(2, 3, PCS[3].mac, PCS[3].ip, PCS[1].mac, PCS[1].ip) },
      { nr: 42, t: "10:42:17,312", dst: PCS[1].mac, src: PCS[4].mac, m: arp(2, 4, PCS[4].mac, PCS[3].ip, PCS[1].mac, PCS[1].ip) },
      { nr: 45, t: "10:42:18,020", dst: PCS[4].mac, src: PCS[1].mac, m: ipv4(1, PCS[4].mac, PCS[1].ip, PCS[3].ip, "Neues Passwort fuer den Drucker: Herbst2026!", 0x2b01) }
    ]}
  };

  /* ---------- Bytes bauen ---------- */
  function macB(m) { return m.split(":").map(function (x) { return parseInt(x, 16); }); }
  function ipB(ip) { return ip.split(".").map(Number); }
  function u16(n) { return [(n >> 8) & 255, n & 255]; }
  function csum(a) { var s = 0; for (var i = 0; i < a.length; i += 2) s += (a[i] << 8) + (a[i + 1] || 0); while (s >> 16) s = (s & 0xffff) + (s >> 16); return (~s) & 0xffff; }
  function build(r) {
    var m = r.m, b = [].concat(macB(r.dst), macB(r.src)), f = [];
    f.push({ id: "dst", s: 0, n: 6 }, { id: "src", s: 6, n: 6 }, { id: "typ", s: 12, n: 2 });
    if (m.kind === "arp") {
      b = b.concat([8, 6, 0, 1, 8, 0, 6, 4, 0, m.op], macB(m.sha), ipB(m.spa), macB(m.tha), ipB(m.tpa));
      f.push({ id: "dat", s: 14, n: 28 }, { id: "op", s: 20, n: 2 }, { id: "sha", s: 22, n: 6 }, { id: "spa", s: 28, n: 4 }, { id: "tha", s: 32, n: 6 }, { id: "tpa", s: 38, n: 4 });
      var pad = 60 - b.length; for (var i = 0; i < pad; i++) b.push(0);
      f.push({ id: "pad", s: 42, n: pad });
    } else {
      var txt = Array.prototype.map.call(m.text, function (c) { return c.charCodeAt(0); });
      var udp = [].concat(u16(50123), u16(5000), u16(8 + txt.length), [0, 0], txt);
      var ip = [0x45, 0].concat(u16(20 + udp.length), u16(m.id), [0, 0, 128, 17, 0, 0], ipB(m.sip), ipB(m.dip));
      var c = csum(ip); ip[10] = c >> 8; ip[11] = c & 255;
      b = b.concat([8, 0], ip, udp);
      f.push({ id: "dat", s: 14, n: b.length - 14 }, { id: "sip", s: 26, n: 4 }, { id: "dip", s: 30, n: 4 }, { id: "txt", s: 42, n: txt.length });
    }
    return { bytes: b, fields: f };
  }
  function hx(n) { return ("0" + n.toString(16).toUpperCase()).slice(-2); }
  function typeOf(r) { return r.m.kind === "arp" ? "0x0806" : "0x0800"; }
  function typeName(r) { return r.m.kind === "arp" ? "ARP" : "IPv4"; }
  function info(r) {
    var m = r.m;
    if (m.kind === "arp") return m.op === 1 ? "Wer hat " + m.tpa + "? Antwort an " + m.spa : m.spa + " ist bei " + m.sha;
    return m.sip + " → " + m.dip + ": „" + m.text.replace("fuer", "für") + "“";
  }

  /* ---------- Zustand ---------- */
  var S;
  function fresh() { return { cap: "mi", sel: null, showHex: false, task: 0, done: {}, tries: {}, playing: false, frUnlocked: false }; }
  function $(id) { return document.getElementById(id); }
  function h(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  /* ---------- Netzbild ---------- */
  var NS = "http://www.w3.org/2000/svg", svg = $("svg"), G = {};
  function el(tag, a, p) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); (p || svg).appendChild(e); return e; }
  function tx(p, x, y, cls, s, anc) { var t = el("text", { x: x, y: y, "class": cls, "text-anchor": anc || "middle" }, p); t.textContent = s; return t; }
  function anchor(p) { return [p.x + (p.x < 500 ? 118 : -118), p.y]; }
  function draw() {
    svg.innerHTML = ""; G = { cab: {}, badge: {} };
    [1, 2, 3, 4].forEach(function (id) {
      var p = PCS[id], a = anchor(p), q = PORT[p.port], mx = (a[0] + q[0]) / 2;
      G.cab[p.port] = el("polyline", { points: [a, [mx, a[1]], [mx, q[1]], q].map(function (z) { return z.join(","); }).join(" "), "class": "cable" });
      tx(svg, q[0] + (q[0] < 500 ? -12 : 12), q[1] - 10, "t-port", "Port " + p.port, q[0] < 500 ? "end" : "start");
    });
    el("rect", { x: SW.x - SW.w / 2, y: SW.y - SW.h / 2, width: SW.w, height: SW.h, rx: 14, fill: "#16202b" });
    tx(svg, SW.x, SW.y - SW.h / 2 + 28, "t-sw", "Switch");
    tx(svg, SW.x - SW.w / 2 + 18, SW.y - SW.h / 2 + 50, "t-swl", "MAC‑TABELLE", "start");
    Object.keys(SWT).forEach(function (mac, i) {
      var y = SW.y - SW.h / 2 + 72 + i * 24;
      tx(svg, SW.x - SW.w / 2 + 18, y, "t-swr", mac, "start");

        return [true, "Richtig. Der Kopf regelt die Zustellung, die ARP‑Daten sind der Inhalt der Frage. Bei der Frage ist der Empfänger unbekannt (Nullen), zugestellt wird an alle (FF). Bei der Antwort ist der Empfänger bekannt, deshalb steht in beiden Feldern die MAC von PC 1."];
      }, sol: function () { pickRadio("c1", "sagt Switch"); pickRadio("c2", "gezielt"); } },
    { t: "Das Feld Typ",
      b: "<p>Nr. 17 und 18 haben im Feld Typ den Wert 0x0806, Nr. 19 und 23 den Wert 0x0800.</p><p class='q'>Wofür sind die Nachrichten mit 0x0806 da?</p>" + sel("a6a", mix(["um die MAC‑Adresse herauszufinden", "um die eigentlichen Daten zu transportieren"])) +
         "<p class='q'>Und die mit 0x0800?</p>" + sel("a6b", mix(["um die MAC‑Adresse herauszufinden", "um die eigentlichen Daten zu transportieren"])),
      check: function () {
        var a = val("a6a"), b = val("a6b"); if (!a || !b) return null;
        if (a.indexOf("MAC") < 0 || b.indexOf("Daten") < 0) return [false, "Vergleiche, was in den Daten von Nr. 17 und Nr. 19 steht."];
        return [true, "Richtig. 0x0800 steht für IPv4: Darin stecken die eigentlichen Daten. 0x0806 steht für " + term("ARP") + " (Address Resolution Protocol). ARP findet zu einer IP‑Adresse die MAC‑Adresse. Nr. 17 ist ein " + term("ARP‑Request") + ", Nr. 18 ein " + term("ARP‑Reply") + "."];
      }, sol: function () { $("a6a").value = "um die MAC‑Adresse herauszufinden"; $("a6b").value = "um die eigentlichen Daten zu transportieren"; } },
    { t: "Nr. 23: Warum keine neue Frage?",
      b: "<p>Vor Nr. 23 gibt es keine ARP‑Nachricht. So sah die Ausgabe von <span class='mono'>arp -a</span> auf PC 1 aus:</p>" +
         "<div style='font-size:13px;font-weight:700;color:var(--muted)'>um 08:15:01, vor Nr. 17</div><div class='term-out'>" + ARP_BEFORE + "</div>" +
         "<div style='font-size:13px;font-weight:700;color:var(--muted)'>um 08:15:03, nach Nr. 18</div><div class='term-out'>" + ARP_AFTER + "</div>" +
         "<p class='q'>Warum muss PC 1 vor Nr. 23 nicht fragen?</p>" + radios("a7", ["PC 1 hat sich die MAC von PC 3 aus Nr. 18 gemerkt.", "Der Switch hat die Nachricht automatisch umgeleitet.", "PC 3 hat sich vorher bei PC 1 gemeldet."]),
      check: function () {
        var a = radio("a7"); if (!a) return null;
        if (a.indexOf("gemerkt") < 0) return [false, "Vergleiche die beiden Ausgaben von arp -a. Was ist dazugekommen?"];
        return [true, "Richtig. PC 1 speichert die Antwort in seinem " + term("ARP‑Cache") + " (das zeigt arp -a). „dynamisch“ heißt: Der Eintrag verfällt nach einiger Zeit. Dann fragt PC 1 wieder."];
      }, sol: function () { pickRadio("a7", "gemerkt"); } }
  ];
  var EXTRA = { t: "Zusatz: Mitschnitt vom Freitag",
    b: "<p>Am Freitag beschwert sich PC 3: Die Nachricht von PC 1 kam nie an. Der Admin hat wieder mitgeschnitten. Wechsle oben zum Mitschnitt <b>Freitag</b>.</p>" +
       "<p class='q'>Welche Nachricht ist verdächtig?</p>" + sel("x1", ["40", "41", "42", "45"]) +
       "<p class='q'>Was ist passiert?</p>" + radios("x2", ["PC 4 hat sich als 192.168.1.103 ausgegeben. PC 1 schickt die Nachricht deshalb an PC 4.", "Der Switch hat Nr. 45 an den falschen Port geschickt.", "PC 3 hat zu langsam geantwortet und wurde übersprungen."]),
    check: function () {
      var a = val("x1"), b = radio("x2"); if (!a || !b) return null;
      if (a !== "42") return [false, "Vergleiche die Absender‑IP und die Absender‑MAC in den Daten der beiden Antworten."];
      if (b.indexOf("PC 4 hat") < 0) return [false, "Schau bei Nr. 45: Zu welcher IP soll sie, und an welche MAC geht sie?"];
      return [true, "Richtig. Nr. 42 ist eine gefälschte Antwort: PC 4 behauptet, 192.168.1.103 zu sein. ARP prüft das nicht. PC 1 überschreibt seinen ARP‑Cache, und Nr. 45 mit dem Passwort landet bei PC 4. Das nennt man " + term("ARP‑Spoofing") + "."];
    }, sol: function () { $("x1").value = "42"; pickRadio("x2", "PC 4 hat"); } };

  function renderTasks() {
    var box = $("tasks"); box.innerHTML = "";
    box.appendChild(h("div", "intro", "<b>Die Lage:</b> Ein Admin hat am Switch mitgeschnitten, während PC 1 die Druckerfrage an PC 3 geschickt hat. Damals kannte PC 1 die MAC von PC 3 noch nicht. Finde heraus, wie PC 1 an die MAC gekommen ist.<br><span style='color:var(--muted)'>Klick eine Zeile im Mitschnitt an, um die Nachricht zu öffnen. Mit ▶ siehst du ihren Weg im Netz.</span>"));
    var list = TASKS.slice(); if (S.done[TASKS.length - 1]) list.push(EXTRA);
    list.forEach(function (T, i) {
      var isExtra = T === EXTRA, done = S.done[i], locked = i > S.task && !done;
      var c = h("div", "task" + (done ? " done" : "") + (locked ? " locked" : ""));
      c.appendChild(h("h3", "", "<span class='n'>" + (done ? "✓" : "") + (isExtra ? "" : " Aufgabe " + (i + 1)) + "</span> " + T.t));
      if (isExtra && i === S.task && !done) c.querySelector("h3").innerHTML = "<span class='n'>★</span> " + T.t;
      var body = h("div", "body");
      if (done) body.innerHTML = "<div class='fb ok'>" + S.done[i] + "</div>";
      else if (!locked) {
        body.innerHTML = T.b;
        var act = h("div", "row-act"), chk = h("button", "btn primary small", "Prüfen");
        chk.onclick = function () {
          var r = T.check(); var fb = c.querySelector(".fb.live") || h("div", "fb live"); body.appendChild(fb);
          if (!r) { fb.className = "fb live err"; fb.textContent = "Bitte beantworte alle Teile."; return; }
          if (r[0]) {
            S.done[i] = r[1]; S.task = i + 1;
            if (i === TASKS.length - 1) S.frUnlocked = true;
            renderAll();
            var next = $("tasks").querySelectorAll(".task")[Math.min(i + 1, $("tasks").querySelectorAll(".task").length - 1)];
            if (next) next.scrollIntoView({ block: "nearest", behavior: "smooth" });
          } else {
            S.tries[i] = (S.tries[i] || 0) + 1; fb.className = "fb live err"; fb.innerHTML = r[1];
            if (S.tries[i] >= 2 && !c.querySelector(".solbtn")) {
              var sb = h("button", "btn soft small solbtn", "Lösung zeigen"); sb.onclick = function () { T.sol(); chk.click(); }; act.appendChild(sb);
            }
          }
        };
        act.insertBefore(chk, act.firstChild); body.appendChild(act);
      }
      c.appendChild(body); box.appendChild(c);
    });
    if (S.done[TASKS.length - 1]) box.insertBefore(resultEl(), box.querySelectorAll(".task")[TASKS.length] || null);
    box.querySelectorAll("[data-open]").forEach(function (b) { b.onclick = function () { openMsg(+b.dataset.open); }; });
    var n = Object.keys(S.done).filter(function (k) { return +k < TASKS.length; }).length;
    $("progTxt").textContent = n >= TASKS.length ? "Alle Aufgaben gelöst" : "Aufgabe " + (n + 1) + " von " + TASKS.length;
    $("progBar").style.width = (100 * n / TASKS.length) + "%";
  }
  function resultEl() {
    var r = h("div", "result");
    r.innerHTML = "<h3>Ergebnis: So kommt PC 1 an die MAC von PC 3</h3>" +
      "<div class='steps3'>" +
      "<div><b class='t'>1. ARP‑Request (Broadcast)</b>PC 1 fragt alle: „Wer hat 192.168.1.103?“ Ziel‑MAC ist FF:FF:FF:FF:FF:FF. Der Switch verteilt die Frage an alle Ports. Alle PCs lesen sie, aber nur PC 3 hat die gesuchte IP. PC 2 und PC 4 verwerfen sie.</div>" +
      "<div><b class='t'>2. ARP‑Reply (Unicast)</b>Nur PC 3 antwortet, gezielt an PC 1. Dessen MAC kennt er aus der Frage.</div>" +
      "<div><b class='t'>3. ARP‑Cache</b>PC 1 merkt sich „192.168.1.103 → 00:1B:44:2C:91:E5“ und kann die Druckerfrage jetzt adressieren:</div></div>" +
      "<div class='done-frame'><div style='background:var(--f-dst)'><div class='k'>Ziel‑MAC</div><div class='v'>00:1B:44:2C:91:E5</div></div><div style='background:var(--f-src)'><div class='k'>Quell‑MAC</div><div class='v'>00:1B:44:11:3A:B7</div></div><div style='background:var(--f-typ)'><div class='k'>Typ</div><div class='v'>0x0800</div></div><div style='background:var(--f-dat)'><div class='k'>Daten</div><div class='v' style='font-family:inherit;font-weight:600;white-space:normal'>an 192.168.1.103: „Ist der Drucker im 2. OG wieder online?“</div></div></div>";
    return r;
  }

  function renderAll() { renderTabs(); renderCap(); renderDetail(); renderTasks(); }
  function reset() { S = fresh(); draw(); $("caption").textContent = "Öffne unten eine Nachricht aus dem Mitschnitt und spiel ihren Weg ab."; renderAll(); }
  var resetArm = null;
  $("resetBtn").onclick = function () {
    var b = $("resetBtn");
    if (S.playing) return;
    if (!resetArm) {
      b.textContent = "Wirklich alles löschen? Nochmal klicken"; b.style.background = "#fdecea"; b.style.color = "#b3261e";
      resetArm = setTimeout(function () { resetArm = null; b.textContent = "↺ Neu starten"; b.style.background = ""; b.style.color = ""; }, 4000);
      return;
    }
    clearTimeout(resetArm); resetArm = null; b.textContent = "↺ Neu starten"; b.style.background = ""; b.style.color = "";
    reset(); document.querySelectorAll(".col, .scrollpart").forEach(function (c) { c.scrollTop = 0; });
  };

  (function () {
    var b = $("fsBtn"), d = document, de = d.documentElement;
    function isFs() { return !!(d.fullscreenElement || d.webkitFullscreenElement); }
    function upd() { b.textContent = (isFs() ? "⤡" : "⛶") + " Vollbild"; b.title = "Vollbild (Taste F)"; }
    function tog() { try { if (isFs()) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else { var r = (de.requestFullscreen || de.webkitRequestFullscreen).call(de); if (r && r.catch) r.catch(function () {}); } } catch (e) {} }
    b.onclick = function () { tog(); b.blur(); };
    d.addEventListener("fullscreenchange", upd); d.addEventListener("webkitfullscreenchange", upd);
    d.addEventListener("keydown", function (e) { if ((e.key === "f" || e.key === "F") && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !e.metaKey && !e.ctrlKey && !e.altKey) tog(); });
    upd();
  })();

  reset();
  window.__S = function () { return S; };
  window.__bytes = function (nr) { return build(rowByNr(nr)).bytes.map(hx).join(" "); };
})();
</script>
