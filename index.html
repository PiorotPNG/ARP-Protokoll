<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission: Nachricht 1</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --ink: #16202b; --muted: #5b6876; --line: #d5dce4;
    --cable: #9aa6b2; --blue: #1558d6; --blue-soft: #e5eefd; --ok: #17794a; --ok-soft: #e3f4ea;
    --bad: #b3261e; --bad-soft: #fdecea; --req: #d9480f; --rep: #17794a;
    --gold: #a86b00; --gold-soft: #fff6dd;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         display: grid; grid-template-rows: auto minmax(0, 1fr); }
  @media (max-width: 1099px), (max-height: 679px) { html, body { height: auto; } }
  button { font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 21px; white-space: nowrap; }
  .stepper { display: flex; gap: 4px; flex: 1; min-width: 0; flex-wrap: wrap; }
  .stepper span { font-size: 13px; font-weight: 700; padding: 5px 11px; border-radius: 999px; color: var(--muted); background: #e2e7ed; white-space: nowrap; }
  .stepper span.on { background: var(--blue); color: #fff; }
  .stepper span.done { background: var(--ok-soft); color: var(--ok); }
  .hbtn { border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; padding: 6px 9px; border-radius: 8px; display: inline-flex; gap: 6px; align-items: center; }
  .hbtn:hover { background: #e2e7ed; color: var(--ink); }
  .insight-btn { background: var(--gold-soft); color: var(--gold); border: 1.5px solid #ecd28c; }
  .insight-btn b { font-variant-numeric: tabular-nums; }
  .insight-btn.pop { animation: pop .6s; }
  @keyframes pop { 30% { transform: scale(1.18); } }

  main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(400px, 1fr); gap: 14px; padding: 0 20px 16px; min-height: 0; }
  @media (max-width: 1099px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }

  .net { position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .net svg { width: 100%; flex: 1; min-height: 0; display: block; }
  @media (max-width: 1099px) { .net svg { height: 56vw; flex: none; } }
  .narr { margin: 0 12px 12px; border-radius: 12px; background: #16202b; color: #fff; padding: 13px 16px; display: flex; gap: 14px; align-items: center; min-height: 66px; transition: background .25s; }
  .narr .txt { flex: 1; font-size: 16.5px; line-height: 1.45; }
  .narr .txt b { color: #ffd28a; }
  .narr .txt .mono { color: #9fc1ff; }
  .narr .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .narr button { border: 0; border-radius: 9px; padding: 9px 15px; font-weight: 700; font-size: 15px; background: #2d3a48; color: #fff; white-space: nowrap; }
  .narr button.primary { background: #fff; color: var(--ink); }
  .narr button:hover { filter: brightness(1.12); }
  .narr.predict { background: #0d3a8c; }
  .narr.predict .q { font-weight: 700; margin-bottom: 8px; }
  .narr.predict .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .narr.predict .opts button { background: #fff; color: #0d3a8c; text-align: left; line-height: 1.25; }
  .narr.predict .opts button small { display: block; font-weight: 500; color: var(--muted); }
  .narr.good { background: #0f5233; } .narr.badn { background: #7d1a14; }
  .narr.good .txt .mono, .narr.badn .txt .mono { color: #fff; }

  .side { display: flex; flex-direction: column; min-height: 0; overflow: auto; padding: 16px 18px; gap: 12px; }
  .who { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: var(--blue); }
  .who::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--blue); }
  .side h2 { margin: 2px 0 0; font-size: 22px; }
  .side p.lead { margin: 0; font-size: 16px; line-height: 1.45; color: #2b3540; }

  .frame { border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; flex-shrink: 0; }
  .frame .ftitle { background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; padding: 6px 12px; display: flex; justify-content: space-between; }
  .frame .ftitle span { opacity: .7; font-weight: 600; }
  .frame .hdr { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 2px dashed var(--line); }
  .frame .hdr > div { padding: 9px 10px; min-width: 0; }
  .frame .hdr > div + div { border-left: 2px dashed var(--line); }
  .flabel { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 5px; }
  .frame .body { padding: 10px 12px 12px; background: #f6f8fb; font-size: 16px; line-height: 1.4; }
  .frame .body .flabel { margin-bottom: 7px; }
  .frame .body .rows { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; align-items: center; }
  .frame .body .rows > span { white-space: nowrap; }

  .slot { position: relative; min-height: 44px; border: 2px dashed #b4bfcb; border-radius: 10px; display: flex; align-items: center; justify-content: center;
          padding: 4px 8px; color: #8792a0; font-size: 13px; line-height: 1.25; background: #fff; text-align: center; transition: background .15s, border-color .15s; cursor: pointer; }
  .slot.can { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
  .slot.over { border-style: solid; background: #d3e2fd; }
  .slot.miss { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s; }
  .slot.filled { border-style: solid; border-color: var(--ink); color: var(--ink); justify-content: space-between; gap: 6px; padding: 4px 6px 4px 10px; text-align: left; }
  .slot.filled .v { font-family: var(--mono); font-size: 15px; font-weight: 700; white-space: nowrap; }
  .slot.filled .c { display: block; font-size: 11px; color: var(--muted); font-weight: 600; font-family: system-ui, sans-serif; }
  .slot .x { border: 0; background: #eef1f5; color: var(--muted); border-radius: 6px; width: 24px; height: 24px; font-size: 14px; line-height: 1; padding: 0; flex-shrink: 0; }
  .slot .kb { border: 0; background: transparent; color: var(--blue); font-weight: 700; font-size: 12.5px; padding: 2px 4px; text-decoration: underline; white-space: nowrap; }
  .slot .ph { pointer-events: none; }
  .seg { display: inline-flex; align-items: center; gap: 0; font-family: var(--mono); font-size: 14.5px; color: var(--ink); }
  .seg input { width: 2.3ch; font: inherit; font-weight: 700; text-align: center; text-transform: uppercase; border: 0; border-bottom: 2px solid var(--blue);
               background: var(--blue-soft); border-radius: 4px 4px 0 0; padding: 3px 0; outline: none; }
  .seg input:focus { background: #cfe0fd; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  .tray { border-radius: 14px; background: #f3f5f8; padding: 10px 12px 12px; flex-shrink: 0; }
  .tray .flabel { display: flex; justify-content: space-between; gap: 8px; }
  .tray .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; border-radius: 10px; background: #fff; border: 2px solid var(--ink);
          padding: 5px 10px 6px; display: inline-flex; flex-direction: column; line-height: 1.2; box-shadow: 0 1px 0 rgba(0,0,0,.08); transition: transform .12s, box-shadow .12s; }
  .chip:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.12); }
  .chip .c { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .chip .v { font-family: var(--mono); font-weight: 700; font-size: 15px; }
  .chip.ip { border-color: var(--blue); } .chip.ip .v { color: var(--blue); }
  .chip.learned { border-style: dashed; border-color: var(--ok); } .chip.learned .c { color: var(--ok); }
  .chip.cache { border-color: var(--ok); background: var(--ok-soft); } .chip.cache .c { color: var(--ok); }
  .chip.locked { border-color: #c3cad3; background: #f0f2f5; cursor: not-allowed; }
  .chip.locked .v, .chip.locked .c { color: #9aa4af; }
  .chip.sel { outline: 3px solid var(--blue); outline-offset: 2px; }
  .chip.term { border-color: var(--gold); background: var(--gold-soft); } .chip.term .v { font-family: inherit; font-size: 16px; color: #6a4300; }
  .ghost { position: fixed; z-index: 1000; pointer-events: none; transform: translate(-50%, -60%) rotate(-3deg); box-shadow: 0 12px 28px rgba(0,0,0,.25); margin: 0; }
  .chip.shake { animation: shake .35s; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { border-radius: 10px; padding: 10px 18px; font-weight: 700; font-size: 16px; border: 2px solid var(--ink); background: #fff; color: var(--ink); }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.soft { border-color: var(--line); color: var(--muted); font-size: 15px; }
  .btn:disabled { opacity: .35; cursor: default; }
  .note { border-radius: 10px; padding: 10px 12px; font-size: 15px; line-height: 1.45; flex-shrink: 0; }
  .note.tip { background: var(--gold-soft); border: 1px solid #ecd28c; }
  .note.err { background: var(--bad-soft); border: 1px solid #f0b4ae; color: #6c1611; }
  .note.ok { background: var(--ok-soft); border: 1px solid #a9dcc0; color: #0f5233; }
  .toast { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 10px;
           font-size: 15px; z-index: 1100; max-width: min(560px, 92vw); box-shadow: 0 10px 30px rgba(0,0,0,.25); }

  .zettel { border: 2px dashed #b4bfcb; border-radius: 14px; padding: 12px 14px; background: #fff; flex-shrink: 0; }
  .zettel q { display: block; quotes: "„" "“"; background: var(--blue-soft); border-left: 5px solid var(--blue); border-radius: 0 8px 8px 0; padding: 8px 10px; font-size: 16px; margin: 8px 0; }
  .zettel dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 16px; align-items: center; }
  .zettel dt { font-weight: 700; color: var(--muted); }
  .zettel dd { margin: 0; font-family: var(--mono); font-weight: 700; }
  .zettel.small q { font-size: 15px; margin: 6px 0; } .zettel.small dl { font-size: 15px; } .zettel.small { padding: 10px 12px; }
  .gap { display: inline-block; padding: 1px 10px; border: 2px solid var(--bad); border-radius: 7px; color: var(--bad); background: repeating-linear-gradient(45deg, var(--bad-soft) 0 7px, #fff 7px 14px); }

  .targets { display: grid; gap: 8px; }
  .target { display: grid; grid-template-columns: 1fr 180px; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: #fff; font-size: 15px; line-height: 1.35; }
  .target .slot { min-height: 42px; }
  .target.right { border-color: #a9dcc0; background: var(--ok-soft); }
  .target .slot.filled { border-color: var(--ok); justify-content: center; }
  .target .slot.filled .v { font-family: inherit; color: var(--ok); }

  .overlay { position: fixed; inset: 0; background: rgba(16,24,33,.55); z-index: 900; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 30px 16px; }
  .sheet { background: #fff; border-radius: 18px; max-width: 1000px; width: 100%; padding: 26px 30px 28px; position: relative; }
  .sheet h2 { margin: 0 0 4px; font-size: 26px; padding-right: 110px; }
  .sheet .sub { color: var(--muted); margin: 0 0 18px; font-size: 15.5px; }
  .sheet .close { position: absolute; top: 14px; right: 14px; border: 0; background: #eef1f5; border-radius: 10px; padding: 8px 12px; font-weight: 700; }
  .ilist { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
  .icard { border-radius: 14px; border: 2px solid #ecd28c; background: var(--gold-soft); padding: 12px 14px; font-size: 15px; line-height: 1.45; }
  .icard b.t { display: block; font-size: 16.5px; margin-bottom: 3px; color: #6a4300; }
  .icard.lockedcard { border-style: dashed; border-color: #cfd6de; background: #f6f8fa; color: #9aa4af; }
  .flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
  @media (max-width: 800px) { .flow { grid-template-columns: 1fr; } }
  .step { border-radius: 16px; padding: 14px 16px; border: 2.5px solid; font-size: 15px; line-height: 1.5; }
  .step .n { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 999px; color: #fff; font-weight: 800; margin-right: 8px; }
  .step h3 { margin: 0 0 2px; font-size: 19px; display: flex; align-items: center; }
  .step .k { font-size: 13px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; margin: 0 0 8px; }
  .step.s1 { border-color: var(--req); } .step.s1 .n { background: var(--req); } .step.s1 .k { color: var(--req); }
  .step.s2 { border-color: var(--rep); } .step.s2 .n { background: var(--rep); } .step.s2 .k { color: var(--rep); }
  .step.s3 { border-color: var(--blue); } .step.s3 .n { background: var(--blue); } .step.s3 .k { color: var(--blue); }
  .step .ex { margin-top: 8px; font-family: var(--mono); font-size: 13px; background: #f3f5f8; border-radius: 8px; padding: 7px 9px; line-height: 1.5; white-space: pre; overflow-x: auto; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 800px) { .facts { grid-template-columns: 1fr; } }
  .fact { background: #f3f5f8; border-radius: 12px; padding: 11px 13px; font-size: 15px; line-height: 1.45; }
  .fact b { display: block; }
  .sheet .actions { margin-top: 18px; }
  @media print {
    @page { size: A4 landscape; margin: 12mm; }
    body > *:not(.overlay) { display: none !important; }
    body { background: #fff; display: block; }
    .overlay { position: static; background: none; padding: 0; display: block; }
    .sheet { padding: 0; max-width: none; }
    .sheet .close, .sheet .actions { display: none !important; }
    .step, .fact, .icard { break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  .cable { stroke: var(--cable); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; transition: stroke .2s; }
  .cable.hot { stroke: var(--blue); stroke-width: 9; }
  .pcb { fill: #fff; stroke: var(--ink); stroke-width: 2.5; }
  .pc.actor .pcb { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 4; }
  .t-name { font-size: 25px; font-weight: 800; fill: var(--ink); }
  .t-ip { font-size: 18px; font-weight: 700; fill: var(--blue); font-family: var(--mono); }
  .t-mac { font-size: 16px; fill: var(--ink); font-family: var(--mono); }
  .t-lab { font-size: 13px; font-weight: 800; fill: var(--muted); letter-spacing: .05em; }
  .t-cache { font-size: 15px; font-family: var(--mono); fill: var(--ok); font-weight: 700; }
  .t-cache.bad { fill: var(--bad); }
  .t-empty { font-size: 14px; fill: #9aa4af; font-style: italic; }
  .youtag rect { fill: var(--blue); } .youtag text { fill: #fff; font-size: 14px; font-weight: 800; }
  .swb { fill: #16202b; }
  .t-sw { font-size: 24px; font-weight: 800; fill: #fff; }
  .t-swrow { font-size: 15px; fill: #cfd8e3; font-family: var(--mono); }
  .t-swrow.port { fill: #fff; font-weight: 800; font-family: system-ui, sans-serif; }
  .swrow-bg { fill: transparent; transition: fill .3s; } .swrow-bg.flash { fill: #2e6b4c; } .swrow-bg.look { fill: #2c4f8f; }
  .t-port { font-size: 16px; font-weight: 800; fill: var(--ink); }
  .badge text { font-size: 16px; font-weight: 800; fill: #fff; }
  .pkt text { font-weight: 800; fill: #fff; }
  .pkt text.to { font-size: 12.5px; font-weight: 700; fill: var(--ink); font-family: var(--mono); }
</style>
</head>
<body>
<header>
  <h1>Mission: Nachricht 1</h1>
  <div class="stepper" id="stepper"></div>
  <button class="hbtn insight-btn" id="insBtn" title="Deine Erkenntnisse">★ Erkenntnisse <b id="insCount">0/5</b></button>
  <button class="hbtn" id="autoBtn" title="Erklärungen automatisch weiterlaufen lassen">▶ Auto: aus</button>
  <button class="hbtn" id="resetBtn">↺ Neu starten</button>
  <button class="hbtn" id="fsBtn"></button>
</header>

<main>
  <section class="card net">
    <svg id="svg" viewBox="0 0 1000 660" preserveAspectRatio="xMidYMid meet" aria-label="Netz mit vier PCs und einem Switch"></svg>
    <div class="narr" id="narr"><div class="txt" id="narrTxt"></div><div class="btns" id="narrBtns"></div></div>
  </section>
  <section class="card side" id="side"></section>
</main>

<script>
(function () {
  "use strict";
  /* =================== Daten =================== */
  var BC = "FF:FF:FF:FF:FF:FF";
  var PCS = [
    { id: 1, port: 2, ip: "192.168.1.101", mac: "00:1B:44:11:3A:B7", x: 845, y: 118 },
    { id: 2, port: 4, ip: "192.168.1.102", mac: "3C:52:82:6E:0F:14", x: 845, y: 542 },
    { id: 3, port: 1, ip: "192.168.1.103", mac: "00:1B:44:2C:91:E5", x: 155, y: 118 },
    { id: 4, port: 3, ip: "192.168.1.104", mac: "F4:8E:38:A0:57:C2", x: 155, y: 542 }
  ];
  PCS.forEach(function (p) { p.name = "PC " + p.id; });
  var SW = { x: 500, y: 330, w: 340, h: 200 };
  var PORTXY = { 1: [SW.x - SW.w / 2, SW.y - 55], 2: [SW.x + SW.w / 2, SW.y - 55], 3: [SW.x - SW.w / 2, SW.y + 55], 4: [SW.x + SW.w / 2, SW.y + 55] };
  function pc(id) { return PCS[id - 1]; }
  function pcByPort(n) { return PCS.filter(function (p) { return p.port === n; })[0]; }
  function pcByMac(x) { return PCS.filter(function (p) { return p.mac === x; })[0]; }

  var INSIGHTS = [
    { id: "bc", t: "Broadcast: eine Frage an alle", x: "Die An‑MAC <span class='mono'>FF:FF:FF:FF:FF:FF</span> bedeutet „an alle“. Der Switch verteilt den Rahmen an alle anderen Ports und <b>jeder</b> PC liest ihn." },
    { id: "owner", t: "Nur der Gesuchte antwortet", x: "Alle lesen die Frage, aber nur der PC mit der gesuchten IP antwortet. Die anderen werfen sie weg." },
    { id: "learn", t: "Der Gefragte lernt mit", x: "PC 3 kennt jetzt die MAC von PC 1: Sie stand als Von‑MAC in der Frage. Er merkt sie sich gleich." },
    { id: "unicast", t: "Unicast: Antwort nur an einen", x: "Die Antwort geht gezielt an die MAC von PC 1. Der Switch kennt sie und leitet nur an Port 2 weiter (Forwarding)." },
    { id: "cache", t: "Der ARP‑Cache merkt sich alles", x: "PC 1 speichert „IP → MAC“. Bei der nächsten Nachricht schaut er zuerst dort nach und muss nicht neu fragen." },
    { id: "flood", t: "Flooding ist nicht „an alle“", x: "Kennt der Switch eine An‑MAC nicht, verteilt er den Rahmen an alle Ports. Die PCs werfen ihn aber weg, weil er nicht an sie adressiert ist.", bonus: true },
    { id: "spoof", t: "ARP glaubt jedem", x: "ARP prüft nicht, wer antwortet. Ein Angreifer im LAN kann sich als anderer PC ausgeben und Nachrichten abfangen (ARP‑Spoofing).", bonus: true }
  ];
  var CORE = INSIGHTS.filter(function (i) { return !i.bonus; }).length;
  var STEPS = ["Auftrag", "Frage", "Antwort", "Nachricht 1", "Begriffe", "Ergebnis"];

  /* =================== Zustand =================== */
  var S = null;
  function fresh() {
    return {
      level: 0, tip: 0, found: {}, auto: S ? S.auto : false, busy: false, err: null,
      sw: { "00:1B:44:2C:91:E5": 1, "00:1B:44:11:3A:B7": 2, "F4:8E:38:A0:57:C2": 3, "3C:52:82:6E:0F:14": 4 },
      caches: { 1: {}, 2: {}, 3: {}, 4: {} }, bad: {},
      slots: {}, sel: null, typing: null, replyBC: false, terms: {}, sentOnce: false, spoofed: false
    };
  }

  /* =================== Hilfen =================== */
  function $(id) { return document.getElementById(id); }
  function h(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function m(x) { return "<span class='mono'>" + x + "</span>"; }
  var toastT;
  function toast(msg) {
    var t = document.querySelector(".toast"); if (!t) { t = h("div", "toast"); document.body.appendChild(t); }
    t.innerHTML = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 4200);
  }

  /* =================== Erkenntnisse =================== */
  function gain(id) {
    if (S.found[id]) return;
    S.found[id] = true; updateIns();
    var b = $("insBtn"); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    var it = INSIGHTS.filter(function (i) { return i.id === id; })[0];
    toast("★ Neue Erkenntnis: <b>" + it.t + "</b>");

    S.caches[1]["192.168.1.103"] = p4.mac; S.bad["1192.168.1.103"] = true; drawCaches();

    await travel({ src: me.mac, dst: p4.mac }, me, "msg", null);
    badge(4, "Nachricht 1 gelesen! 😈", "#b3261e");
    gain("spoof"); S.spoofed = true; S.busy = false;
    await narrate("Nachricht 1 ist bei <b>PC 4</b> gelandet. Er kann sie lesen, verändern oder weiterleiten, ohne dass jemand es merkt. Das nennt man <b>ARP‑Spoofing</b>.", [{ id: "ok", label: "Verstanden", primary: true }], "badn");
    clearBadges(); S.caches[1] = { "192.168.1.103": p3.mac }; S.bad = {}; drawCaches(); render();
    narrSay("Besprecht rechts die drei Fragen.");
  }

  /* =================== Ablauf =================== */
  function goLevel(n) {
    S.level = n; S.err = null; S.sel = null; S.typing = null;
    render();
    var say = [
      [1, "PC 1 möchte Nachricht 1 an PC 3 schicken. Rechts steht deine Mission."],
      [1, "Du bist <b>PC 1</b>. Baue rechts eine Frage, mit der du die MAC zur IP " + m("192.168.1.103") + " findest."],
      [3, "Du bist <b>PC 3</b>. Baue die Antwort für PC 1. Grün gestrichelte Karten hast du aus der Frage gelernt."],
      [1, "Du bist wieder <b>PC 1</b>. In deinem ARP‑Cache steht jetzt ein Eintrag. Nutze ihn!"],
      [null, "Zieh rechts jeden Begriff zu seiner Beschreibung."],
      [null, "🎉 Mission erfüllt! Öffne rechts die Zusammenfassung."]
    ][n];
    setActor(say[0]); narrSay(say[1]);
  }
  function reset() { S = fresh(); updateIns(); drawNet(); goLevel(0); }
  $("resetBtn").onclick = function () {
    if (S.busy) { toast("Warte, bis die Animation fertig ist."); return; }
    if (S.level === 0 || confirm("Mission wirklich neu starten?")) reset();
  };

  (function () {
    var b = $("fsBtn"), d = document, de = d.documentElement;
    function isFs() { return !!(d.fullscreenElement || d.webkitFullscreenElement); }
    function upd() { b.innerHTML = (isFs() ? "⤡" : "⛶") + " Vollbild"; b.title = "Vollbild (Taste F)"; }
    function tog() {
      try {
        if (isFs()) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
        else { var r = (de.requestFullscreen || de.webkitRequestFullscreen).call(de); if (r && r.catch) r.catch(function () { toast("Vollbild ist hier gesperrt. Öffne die Seite direkt im Browser."); }); }
      } catch (e) { toast("Vollbild wird hier nicht unterstützt."); }
    }
    b.onclick = function () { tog(); b.blur(); };
    d.addEventListener("fullscreenchange", upd); d.addEventListener("webkitfullscreenchange", upd);
    d.addEventListener("keydown", function (e) { if ((e.key === "f" || e.key === "F") && !/INPUT|TEXTAREA/.test(e.target.tagName) && !e.metaKey && !e.ctrlKey && !e.altKey) tog(); });
    upd();
  })();

  reset();
  window.__S = function () { return S; };
})();
</script>
